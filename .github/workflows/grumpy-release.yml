name: Grumpy Node Release

# builds the Grumpy Node firmwares and publishes them as a GitHub release (marked latest).
# runs automatically when an upstream sync PR (label: upstream-release) is merged into main,
# or manually with a version (e.g: v1.18.0-g2) for Grumpy-only fixes.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g: v1.18.0-g2), published as tag grumpy-<version>'
        required: true
        type: string
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:

  prepare:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       contains(github.event.pull_request.labels.*.name, 'upstream-release'))
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
      notes: ${{ steps.version.outputs.notes }}
    steps:
      - name: Determine Version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
            SHA="$GITHUB_SHA"
            NOTES="Grumpy Node firmware $VERSION."
          else
            # head ref of "upstream-sync/v1.2.3" should give a version of "v1.2.3"
            VERSION="${HEAD_REF#upstream-sync/}"
            SHA="$MERGE_SHA"
            NOTES="Grumpy Node firmware based on MeshCore $VERSION. Upstream changes: https://github.com/meshcore-dev/MeshCore/releases?q=$VERSION"
          fi

          # version is used in file paths and tag names, so keep it simple
          if ! [[ "$VERSION" =~ ^v[0-9A-Za-z.\-]+$ ]]; then
            echo "invalid version: $VERSION"
            exit 1
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "notes=$NOTES" >> $GITHUB_OUTPUT

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - Grumpy_Node_repeater
          - Grumpy_Node_room_server
          - Grumpy_Node_companion_radio_ble
          - Grumpy_Node_companion_radio_usb
          - Grumpy_Node_companion_radio_wifi
          - Grumpy_Node_kiss_modem
      fail-fast: false
    steps:

      - name: Clone Repo
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      - name: Build Firmware
        env:
          FIRMWARE_VERSION: ${{ needs.prepare.outputs.version }}
        run: /usr/bin/env bash build.sh build-firmware ${{ matrix.target }}

      - name: Upload Workflow Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: "${{ matrix.target }}"
          path: out
          if-no-files-found: error

  # only runs if every firmware built, so customers never get a partial release
  create-release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:

      - name: Download All Artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: out

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "grumpy-${{ needs.prepare.outputs.version }}"
          target_commitish: ${{ needs.prepare.outputs.sha }}
          name: "Grumpy Node ${{ needs.prepare.outputs.version }}"
          body: ${{ needs.prepare.outputs.notes }}
          draft: false
          make_latest: true
          files: out/*
